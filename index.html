<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Календарь Репетитора PRO</title>
    <!-- PWA Meta-теги -->
<meta name="theme-color" content="#4CAF50">
<meta name="description" content="Удобный календарь для планирования уроков с учениками. Работает офлайн.">

<!-- Иконки для iOS (там свой синтаксис) -->
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Репетитор">

<!-- Манифест PWA -->
<link rel="manifest" href="manifest.json">

<!-- Иконка для вкладки браузера -->
<link rel="icon" type="image/png" href="icon-192.png">
    <style>
        :root {
            --primary: #4CAF50;
            --bg: #f4f4f9;
            --card-bg: #ffffff;
            --text: #333;
            --text-secondary: #666;
            --text-muted: #999;
            --header-bg: rgba(255, 255, 255, 0.95);
            --cell-bg: rgba(255, 255, 255, 0.92);
            --cell-border: rgba(0,0,0,0.05);
            --cell-hover: rgba(255,255,255,1);
            --day-header-bg: rgba(255, 255, 255, 0.8);
            --modal-bg: #ffffff;
            --modal-header-bg: #f8f9fa;
            --border-color: #eee;
            --input-bg: #ffffff;
            --input-border: #ddd;
            --tab-inactive: #888;
            --nav-btn-bg: #f0f0f0;
            --nav-btn-color: #555;
            --emoji-picker-bg: #fafafa;
            --emoji-hover: #e8f5e9;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
            --border-radius: 8px;
        }

        body.dark {
            --bg: #1a1a1f;
            --card-bg: #26262c;
            --text: #e8e8ec;
            --text-secondary: #b0b0b8;
            --text-muted: #808088;
            --header-bg: rgba(30, 30, 36, 0.95);
            --cell-bg: rgba(38, 38, 44, 0.92);
            --cell-border: rgba(255,255,255,0.08);
            --cell-hover: rgba(50, 50, 58, 1);
            --day-header-bg: rgba(38, 38, 44, 0.85);
            --modal-bg: #26262c;
            --modal-header-bg: #2e2e36;
            --border-color: #3a3a44;
            --input-bg: #1f1f24;
            --input-border: #3a3a44;
            --tab-inactive: #888;
            --nav-btn-bg: #33333a;
            --nav-btn-color: #b0b0b8;
            --emoji-picker-bg: #1f1f24;
            --emoji-hover: #2e3d2f;
            --shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg); color: var(--text);
            padding-bottom: 80px;
            transition: background 0.3s, color 0.3s;
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        body.size-compact .day-cell { min-height: 65px; padding: 3px; gap: 2px; }
        body.size-compact .student-card { font-size: 0.62rem; padding: 3px; }
        body.size-compact .student-card .card-sub { font-size: 0.55rem; }
        body.size-compact .date-number { font-size: 0.65rem; }
        body.size-compact .day-header { font-size: 0.65rem; padding: 5px 0; }
        body.size-compact .calendar-grid { gap: 3px; padding: 6px; }
        body.size-compact .student-card .card-emoji { font-size: 0.75rem; }

        body.size-large .day-cell { min-height: 130px; padding: 8px; gap: 6px; }
        body.size-large .student-card { font-size: 0.85rem; padding: 8px; border-radius: 6px; }
        body.size-large .student-card .card-sub { font-size: 0.72rem; }
        body.size-large .student-card .card-emoji { font-size: 1.05rem; }
        body.size-large .date-number { font-size: 0.9rem; }
        body.size-large .day-header { font-size: 0.85rem; padding: 10px 0; }
        body.size-large .calendar-grid { gap: 8px; padding: 15px; }

        header {
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 15px;
            box-shadow: var(--shadow);
            position: sticky; top: 0; z-index: 100;
            transition: background 0.3s;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        h1 { font-size: 1.1rem; margin: 0; font-weight: 700; color: var(--text); }
        .header-actions { display: flex; gap: 5px; }
        .icon-btn {
            background: none; border: none; font-size: 1.2rem; cursor: pointer;
            padding: 5px 8px; border-radius: 50%; transition: background 0.2s; color: var(--text);
        }
        .icon-btn:hover { background: var(--nav-btn-bg); }

        .month-navigation { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .nav-btn {
            background: var(--nav-btn-bg); border: none;
            width: 36px; height: 36px; border-radius: 50%;
            cursor: pointer; font-size: 1.1rem; font-weight: 700;
            color: var(--nav-btn-color); transition: all 0.2s;
        }
        .nav-btn:hover { background: var(--primary); color: white; }
        .month-selector-wrapper { flex: 1; text-align: center; }
        #monthSelect {
            background: transparent; border: none; font-size: 1rem; font-weight: 700;
            color: var(--primary); cursor: pointer; font-family: inherit;
            padding: 5px 10px; border-radius: 6px; appearance: none; text-align: center;
        }
        #monthSelect:hover { background: var(--nav-btn-bg); }
        #monthSelect option { color: #333; background: #fff; }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 5px; padding: 10px; max-width: 900px; margin: 0 auto;
        }

        .day-header {
            text-align: center; font-size: 0.75rem; color: var(--text-secondary);
            font-weight: 600; padding: 8px 0;
            background: var(--day-header-bg); border-radius: 6px;
            backdrop-filter: blur(5px);
        }

        .day-cell {
            background: var(--cell-bg); backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: var(--border-radius); min-height: 90px;
            padding: 4px; display: flex; flex-direction: column; gap: 4px;
            border: 1px solid var(--cell-border);
            position: relative; cursor: pointer; transition: background 0.2s;
        }
        .day-cell:hover { background: var(--cell-hover); }
        .day-cell.today { border: 2px solid var(--primary); }

        .date-number { font-size: 0.75rem; color: var(--text-muted); align-self: flex-end; font-weight: 600; }

        .student-card {
            background: #e8f5e9; border-radius: 4px; padding: 4px;
            font-size: 0.7rem; cursor: pointer; transition: transform 0.1s;
            overflow: hidden; border-left: 3px solid #4CAF50; color: #333;
        }
        body.dark .student-card { color: #e8e8ec; }
        .student-card:active { transform: scale(0.98); }
        .student-card .card-header { 
            font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center; gap: 3px;
        }
        .student-card .card-emoji { font-size: 0.9rem; flex-shrink: 0; }
        .student-card .card-sub { font-size: 0.6rem; color: var(--text-secondary); opacity: 0.9; }

        .student-card.has-content .card-header::after {
            content: ' ●'; color: #ff9800; font-size: 0.5rem;
            vertical-align: middle; margin-left: auto;
        }
        body.hide-indicator .student-card.has-content .card-header::after { display: none; }

        .overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 999;
        }
        .overlay.active { display: block; }

        .modal-card {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%; max-width: 500px; max-height: 90vh;
            background: var(--modal-bg); border-radius: 12px;
            z-index: 1000; display: none; flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden; opacity: 0; transition: all 0.2s ease-out;
            color: var(--text);
        }
        .modal-card.active { display: flex; transform: translate(-50%, -50%) scale(1); opacity: 1; }

        .modal-header {
            padding: 15px; background: var(--modal-header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h2 { margin: 0; font-size: 1.1rem; color: var(--text); }
        .close-btn { font-size: 24px; cursor: pointer; color: var(--text-muted); line-height: 1; }
        .close-btn:hover { color: var(--text); }

        .tabs { display: flex; border-bottom: 1px solid var(--border-color); background: var(--modal-bg); }
        .tab-btn {
            flex: 1; padding: 12px 5px; background: none; border: none;
            font-size: 0.85rem; font-weight: 600; color: var(--tab-inactive);
            cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s;
        }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .modal-body { padding: 15px; overflow-y: auto; flex: 1; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 8px; border: 1px solid var(--input-border);
            border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; 
            font-family: inherit; background: var(--input-bg); color: var(--text);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        /* === НОВЫЙ БЛОК: ПЕРИОДЫ ДНЯ === */
        .time-periods {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }
        .period-btn {
            padding: 8px 2px;
            background: var(--emoji-picker-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .period-btn .period-icon { font-size: 1rem; }
        .period-btn:hover { background: var(--emoji-hover); }
        .period-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .time-slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 10px;
            min-height: 30px;
        }
        .time-slot-btn {
            padding: 8px 0;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text);
            transition: all 0.15s;
        }
        .time-slot-btn:hover { background: var(--emoji-hover); border-color: var(--primary); }
        .time-slot-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Поле ручного ввода */
        .manual-time-wrapper {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 8px;
        }
        .manual-time-input {
            flex: 1;
            padding: 10px 12px;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            transition: border-color 0.2s;
            font-family: 'Courier New', monospace;
        }
        .manual-time-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(76,175,80,0.15);
        }
        .manual-time-input.valid { border-color: var(--primary); }
        .manual-time-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 4px;
        }

        .schedule-slot {
            background: var(--emoji-picker-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px; padding: 10px; margin-bottom: 8px;
        }
        .schedule-slot-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-size: 0.8rem; font-weight: 600;
            color: var(--text-secondary);
        }
        .schedule-slot-remove {
            background: none; border: none; color: #ff5252;
            cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 4px;
        }
        .schedule-slot-remove:hover { background: rgba(255,82,82,0.15); }
        .add-slot-btn {
            width: 100%; padding: 10px; background: transparent;
            border: 2px dashed var(--input-border); border-radius: 8px;
            cursor: pointer; color: var(--text-secondary);
            font-weight: 600; font-size: 0.85rem; transition: all 0.2s;
        }
        .add-slot-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--emoji-hover); }

        .extend-checkbox-row {
            display: flex; align-items: center; gap: 8px;
            padding: 10px; background: var(--emoji-picker-bg);
            border-radius: 8px; border: 1px solid var(--border-color); margin-top: 8px;
        }
        .extend-checkbox-row input { width: auto; }
        .extend-checkbox-row label { margin: 0; cursor: pointer; font-size: 0.85rem; }
        .extend-months-select {
            margin-left: auto; width: auto !important;
            padding: 4px 8px !important; font-size: 0.8rem !important;
        }

        .emoji-input-row { display: flex; gap: 5px; align-items: center; }
        .emoji-input-row input { flex: 1; text-align: center; font-size: 1.2rem; padding: 6px; }
        .emoji-clear {
            background: var(--nav-btn-bg); border: 1px solid var(--input-border);
            border-radius: 6px; padding: 8px 12px; cursor: pointer;
            font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;
        }
        .emoji-clear:hover { background: var(--cell-hover); }
        .emoji-picker {
            display: grid; grid-template-columns: repeat(8, 1fr);
            gap: 4px; margin-top: 8px; max-height: 160px; overflow-y: auto;
            padding: 6px; background: var(--emoji-picker-bg);
            border-radius: 6px; border: 1px solid var(--border-color);
        }
        .emoji-option {
            font-size: 1.3rem; padding: 6px 0; text-align: center;
            cursor: pointer; border-radius: 4px; user-select: none;
            transition: background 0.15s;
        }
        .emoji-option:hover { background: var(--emoji-hover); }

        .weekday-selector { display: flex; gap: 5px; margin-top: 5px; }
        .weekday-checkbox { display: none; }
        .weekday-label {
            flex: 1; text-align: center; padding: 8px 0;
            border: 1px solid var(--input-border); border-radius: 6px;
            font-size: 0.8rem; cursor: pointer; user-select: none;
            background: var(--input-bg); transition: all 0.2s; color: var(--text);
        }
        .weekday-checkbox:checked + .weekday-label {
            background: var(--primary); color: white; border-color: var(--primary);
        }

        .color-picker-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .color-swatch {
            width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; border: 2px solid transparent; transition: transform 0.1s;
        }
        .color-swatch:hover { transform: scale(1.1); }
        .color-swatch.selected { border-color: var(--text); transform: scale(1.1); }

        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #ff5252; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-secondary { background: var(--nav-btn-bg); color: var(--text); }

        .fab {
            position: fixed; bottom: 20px; right: 20px;
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--primary); color: white; font-size: 30px;
            border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 500;
        }

        .hidden { display: none !important; }
        .info-note {
            background: #e3f2fd; color: #1565c0;
            padding: 10px; border-radius: 6px; font-size: 0.8rem;
            margin-bottom: 15px; border-left: 3px solid #1565c0;
        }
        body.dark .info-note { background: #1a2b3d; color: #90caf9; border-left-color: #90caf9; }

        .pattern-section-title {
            font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 8px 0;
        }
        .pattern-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .pattern-item {
            aspect-ratio: 1; border-radius: 8px; cursor: pointer;
            border: 3px solid transparent; transition: transform 0.2s;
            background-size: cover; background-position: center;
            position: relative; overflow: hidden;
        }
        .pattern-item:hover { transform: scale(1.05); }
        .pattern-item.selected { border-color: var(--primary); }
        .pattern-item.selected::after {
            content: '✓'; position: absolute; bottom: 4px; right: 4px;
            background: var(--primary); color: white; width: 20px; height: 20px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700;
        }
        .pattern-none { 
            background: var(--cell-bg); display: flex; align-items: center; justify-content: center; 
            color: var(--text-muted); font-size: 0.75rem; border: 1px dashed var(--input-border);
        }
        .pattern-none.selected::after { content: '✓'; }

        .size-selector {
            display: flex; gap: 8px; background: var(--emoji-picker-bg);
            padding: 5px; border-radius: 8px; border: 1px solid var(--border-color);
        }
        .size-btn {
            flex: 1; padding: 8px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 600; font-size: 0.8rem;
            background: transparent; color: var(--text-secondary); transition: all 0.2s;
        }
        .size-btn.active { background: var(--primary); color: white; }

        .day-detail-list { display: flex; flex-direction: column; gap: 8px; }
        .day-detail-card {
            padding: 12px; border-radius: 8px; border-left: 4px solid var(--primary);
            cursor: pointer; transition: transform 0.1s; background: var(--emoji-picker-bg);
        }
        .day-detail-card:hover { transform: translateX(3px); }
        .day-detail-card .dd-name { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
        .day-detail-card .dd-time { font-size: 0.8rem; color: var(--text-secondary); margin-top: 3px; }
        .day-detail-card .dd-plan { font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px; opacity: 0.85; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Мои уроки</h1>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" title="Тема">🌙</button>
                <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
            </div>
        </div>
        <div class="month-navigation">
            <button class="nav-btn" id="prevMonth">‹</button>
            <div class="month-selector-wrapper">
                <select id="monthSelect"></select>
            </div>
            <button class="nav-btn" id="nextMonth">›</button>
        </div>
    </header>

    <div class="calendar-grid" id="calendarGrid"></div>

    <button class="fab" id="addFab">+</button>
    <div class="overlay" id="overlay"></div>

    <div class="modal-card" id="modalCard">
        <div class="modal-header">
            <h2 id="modalTitle">Новый урок</h2>
            <span class="close-btn" id="closeModal">&times;</span>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="plan">План</button>
            <button class="tab-btn" data-tab="homework">ДЗ (Задано)</button>
            <button class="tab-btn" data-tab="homework_next">ДЗ (Задать)</button>
        </div>

        <div class="modal-body">
            <div class="tab-content active" id="tab-plan">
                <div class="info-note hidden" id="seriesNote">
                    ✨ При сохранении создастся серия. План и ДЗ сохранятся <b>только для этого дня</b>.
                </div>
                <div class="form-group">
                    <label>Ученик</label>
                    <input type="text" id="studentName" placeholder="Имя ученика">
                </div>

                <div class="form-group">
                    <label>Расписание (можно несколько слотов)</label>
                    <div id="scheduleSlots"></div>
                    <button type="button" class="add-slot-btn" id="addSlotBtn">+ Ещё слот</button>
                </div>

                <div class="form-group">
                    <label>Ярлык предмета (флаг / эмодзи)</label>
                    <div class="emoji-input-row">
                        <input type="text" id="lessonEmoji" placeholder="🌍" maxlength="4">
                        <button type="button" class="emoji-clear" id="clearEmoji">Убрать</button>
                    </div>
                    <div class="emoji-picker" id="emojiPicker"></div>
                </div>
                <div class="form-group">
                    <label>План урока</label>
                    <textarea id="lessonPlan" placeholder="Что будем делать на уроке..."></textarea>
                </div>
                <div class="form-group">
                    <label>Цвет карточки</label>
                    <div class="color-picker-row" id="colorPicker"></div>
                </div>
                <div class="form-group">
                    <label>Ссылка / Файл</label>
                    <input type="url" id="lessonLink" placeholder="https://...">
                </div>

                <div class="form-group" id="extendGroup">
                    <div class="extend-checkbox-row">
                        <input type="checkbox" id="extendMonths">
                        <label for="extendMonths">Продлить на</label>
                        <select class="extend-months-select" id="extendMonthsCount">
                            <option value="1">1 мес.</option>
                            <option value="2">2 мес.</option>
                            <option value="3" selected>3 мес.</option>

        // === ФУНКЦИЯ: АВТОФОРМАТ ВРЕМЕНИ ===
        // Принимает "1800", "18.00", "18:00", "18 00", "18-00" → возвращает "18:00"
        // Принимает "9" → возвращает "09:00"
        // Принимает "930" → возвращает "09:30"
        function formatTimeInput(raw) {
            if (!raw) return '';
            // Убираем всё лишнее
            let cleaned = raw.toString().replace(/[^0-9]/g, '');
            
            if (cleaned.length === 0) return '';
            
            let hours, minutes;
            
            if (cleaned.length <= 2) {
                // Просто часы
                hours = parseInt(cleaned);
                minutes = 0;
            } else if (cleaned.length === 3) {
                // 930 → 9:30, 180 → 1:80? нет → считаем 1:80 невалидным
                // Логика: 930 → 9:30; 1830 не влезет в 3 символа
                hours = parseInt(cleaned.substring(0, 1));
                minutes = parseInt(cleaned.substring(1, 3));
            } else if (cleaned.length === 4) {
                // 1800 → 18:00
                hours = parseInt(cleaned.substring(0, 2));
                minutes = parseInt(cleaned.substring(2, 4));
            } else {
                // Больше 4 — берём последние 4 или обрезаем
                cleaned = cleaned.substring(0, 4);
                hours = parseInt(cleaned.substring(0, 2));
                minutes = parseInt(cleaned.substring(2, 4));
            }
            
            // Валидация
            if (isNaN(hours) || hours > 23) hours = 23;
            if (isNaN(minutes) || minutes > 59) minutes = 59;
            
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        // Проверка на валидное время
        function isValidTime(str) {
            return /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(str);

        // === НОВЫЙ СОЗДАТЕЛЬ СЛОТА С ПЕРИОДАМИ ДНЯ ===
        function createSlotElement(initialDay = null, initialTime = '', removable = true) {
            const slot = document.createElement('div');
            slot.className = 'schedule-slot';
            
            const header = document.createElement('div');
            header.className = 'schedule-slot-header';
            header.innerHTML = `<span>Слот</span>`;
            if (removable) {
                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'schedule-slot-remove';
                removeBtn.innerHTML = '&times;';
                removeBtn.onclick = () => slot.remove();
                header.appendChild(removeBtn);
            }
            slot.appendChild(header);

            // Дни недели
            const weekdaySelector = document.createElement('div');
            weekdaySelector.className = 'weekday-selector';
            const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            const dayValues = [1, 2, 3, 4, 5, 6, 0];
            
            days.forEach((day, i) => {
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'weekday-checkbox';
                cb.value = dayValues[i];
                cb.id = `wd_${Date.now()}_${i}_${Math.random().toString(36).substr(2,5)}`;
                if (initialDay !== null && initialDay === dayValues[i]) cb.checked = true;
                
                const lbl = document.createElement('label');
                lbl.className = 'weekday-label';
                lbl.htmlFor = cb.id;
                lbl.textContent = day;
                
                weekdaySelector.appendChild(cb);
                weekdaySelector.appendChild(lbl);
            });
            slot.appendChild(weekdaySelector);

            // Заголовок "Время"
            const timeLabel = document.createElement('label');
            timeLabel.style.cssText = 'display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); margin: 12px 0 5px 0;';
            timeLabel.textContent = 'Время';
            slot.appendChild(timeLabel);

            // Выбранное время (отображается вверху)
            const selectedTimeDisplay = document.createElement('div');
            selectedTimeDisplay.style.cssText = `
                text-align: center;
                font-size: 1.4rem;
                font-weight: 700;
                color: var(--primary);
                padding: 8px;
                margin-bottom: 8px;
                background: var(--input-bg);
                border-radius: 8px;
                border: 2px solid var(--primary);
                letter-spacing: 2px;
                font-family: 'Courier New', monospace;
                min-height: 42px;
                display: flex;
                align-items: center;
                justify-content: center;
            `;
            selectedTimeDisplay.textContent = initialTime || '--:--';
            slot.appendChild(selectedTimeDisplay);

            let currentTime = initialTime || '';

            // Обновление отображения времени
            function setTime(newTime) {
                currentTime = newTime;
                if (newTime) {
                    selectedTimeDisplay.textContent = newTime;
                    selectedTimeDisplay.style.color = 'var(--primary)';
                } else {
                    selectedTimeDisplay.textContent = '--:--';
                    selectedTimeDisplay.style.color = 'var(--text-muted)';
                }
            }

            // === ПЕРИОДЫ ДНЯ ===
            const periodsContainer = document.createElement('div');
            periodsContainer.className = 'time-periods';
            
            let currentPeriod = 'evening'; // По умолчанию вечер
            
            // Определяем, в каком периоде находится initialTime
            if (initialTime) {
                const h = parseInt(initialTime.split(':')[0]);
                if (h >= 6 && h < 12) currentPeriod = 'morning';
                else if (h >= 12 && h < 15) currentPeriod = 'noon';
                else if (h >= 15 && h < 18) currentPeriod = 'afternoon';
                else if (h >= 18 && h < 21) currentPeriod = 'evening';
                else currentPeriod = 'night';
            }
            
            Object.keys(TIME_PERIODS).forEach(periodKey => {
                const period = TIME_PERIODS[periodKey];
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'period-btn';
                if (periodKey === currentPeriod) btn.classList.add('active');
                btn.innerHTML = `<span class="period-icon">${period.icon}</span><span>${period.name}</span>`;
                btn.onclick = () => {
                    periodsContainer.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPeriod = periodKey;
                    renderSlotsForPeriod(periodKey);
                };
                periodsContainer.appendChild(btn);
            });
            slot.appendChild(periodsContainer);

            // === СЛОТЫ ДЛЯ ВЫБРАННОГО ПЕРИОДА ===
            const slotsGrid = document.createElement('div');
            slotsGrid.className = 'time-slots-grid';
            slot.appendChild(slotsGrid);

            function renderSlotsForPeriod(periodKey) {
                slotsGrid.innerHTML = '';
                const period = TIME_PERIODS[periodKey];
                period.slots.forEach(time => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'time-slot-btn';
                    btn.textContent = time;
                    if (time === currentTime) btn.classList.add('selected');
                    btn.onclick = () => {
                        slotsGrid.querySelectorAll('.time-slot-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        setTime(time);
                        // Очищаем поле ручного ввода
                        manualInput.value = '';
                        manualInput.classList.remove('valid');
                    };
                    slotsGrid.appendChild(btn);
                });
            }
            renderSlotsForPeriod(currentPeriod);

            // === РУЧНОЙ ВВОД ===
            const manualLabel = document.createElement('div');
            manualLabel.style.cssText = 'font-size: 0.7rem; color: var(--text-muted); margin: 8px 0 4px 0; text-align: center;';
            manualLabel.textContent = '— или введи вручную —';
            slot.appendChild(manualLabel);

            const manualWrapper = document.createElement('div');
            manualWrapper.className = 'manual-time-wrapper';
            
            const manualInput = document.createElement('input');
            manualInput.type = 'text';
            manualInput.className = 'manual-time-input';
            manualInput.placeholder = '18:00';
            manualInput.maxLength = 5;
            manualInput.inputMode = 'numeric';
            manualInput.value = initialTime && !TIME_PERIODS[currentPeriod].slots.includes(initialTime) ? initialTime : '';
            if (manualInput.value) manualInput.classList.add('valid');
            
            // Автоформат при вводе
            manualInput.addEventListener('input', (e) => {
                let val = e.target.value;
                // Разрешаем только цифры и разделители
                val = val.replace(/[^0-9:.\- ]/g, '');
                
                // Если пользователь стёр всё — сбрасываем
                if (!val) {
                    manualInput.classList.remove('valid');
                    return;
                }
                
                // Автоматически вставляем ":" после 2 цифр
                const digits = val.replace(/[^0-9]/g, '');
                if (digits.length === 2 && !val.includes(':')) {
                    // Добавляем ":" автоматически? Нет — подождём blur
                }
                
                // Проверяем, валидно ли
                const formatted = formatTimeInput(digits);
                if (isValidTime(formatted) && digits.length >= 3) {
                    manualInput.classList.add('valid');
                } else {
                    manualInput.classList.remove('valid');
                }
            });
            
            // Форматирование при потере фокуса
            manualInput.addEventListener('blur', () => {
                const val = manualInput.value;
                if (!val) return;
                const formatted = formatTimeInput(val);
                if (isValidTime(formatted)) {
                    manualInput.value = formatted;
                    manualInput.classList.add('valid');
                    setTime(formatted);
                    // Снимаем выделение со слотов
                    slotsGrid.querySelectorAll('.time-slot-btn').forEach(b => b.classList.remove('selected'));
                }
            });
            
            // Enter для подтверждения
            manualInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    manualInput.blur();
                }
            });
            
            manualWrapper.appendChild(manualInput);
            slot.appendChild(manualWrapper);

            const hint = document.createElement('div');
            hint.className = 'manual-time-hint';
            hint.textContent = 'Например: 18:15 или просто 1815';
            slot.appendChild(hint);

            // Инициализация отображения
            setTime(initialTime);

            // Метод для получения данных
            slot.getData = () => {
                const days = Array.from(slot.querySelectorAll('.weekday-checkbox:checked')).map(cb => parseInt(cb.value));
                // Время берём из currentTime, но если есть валидное поле ручного ввода — приоритет ему
                let time = currentTime;
                if (manualInput.value && isValidTime(manualInput.value)) {
                    time = manualInput.value;
                }
                return { days, time };
            };

            return slot;
        }

        // === ЛОГИКА КАЛЕНДАРЯ ===
        function saveToStorage() {
            localStorage.setItem('tutorLessonsPro', JSON.stringify(lessons));
        }

        function renderCalendar() {
            grid.innerHTML = '';
            DAYS_SHORT.forEach(day => {
                const div = document.createElement('div');
                div.className = 'day-header';
                div.textContent = day;
                grid.appendChild(div);
            });

            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;

            for (let i = 0; i < startOffset; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell';
                empty.style.background = 'transparent';
                empty.style.border = 'none';
                empty.style.backdropFilter = 'none';
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                if (day === now.getDate() && currentMonth === now.getMonth() && currentYear === now.getFullYear()) {
                    cell.classList.add('today');
                }
                const dateNum = document.createElement('div');
                dateNum.className = 'date-number';
                dateNum.textContent = day;
                cell.appendChild(dateNum);

                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayLessons = lessons.filter(l => l.date === dateStr).sort((a,b) => (a.time || '').localeCompare(b.time || ''));

                dayLessons.forEach(lesson => {
                    const card = document.createElement('div');
                    card.className = 'student-card';
                    const hasContent = lesson.plan || lesson.homeworkGiven || lesson.homeworkNext;
                    if (hasContent) card.classList.add('has-content');
                    card.style.backgroundColor = lesson.color + '30';
                    card.style.borderLeftColor = lesson.color;
                    const emojiPart = lesson.emoji ? `<span class="card-emoji">${lesson.emoji}</span>` : '';
                    card.innerHTML = `
                        <div class="card-header" style="color: ${lesson.color}">
                            ${emojiPart}
                            <span style="overflow: hidden; text-overflow: ellipsis;">${lesson.name}</span>
                        </div>
                        <div class="card-sub">${lesson.time || '--:--'}</div>
                    `;
                    card.onclick = (e) => {
                        e.stopPropagation();
                        openModal(lesson, dateStr);
                    };
                    cell.appendChild(card);
                });

                cell.onclick = (e) => {
                    if(e.target.closest('.student-card')) return;
                    if (e.detail === 2 || dayLessons.length > 2) {
                        openDayDetail(dateStr, day);
                    } else {
                        openModal(null, dateStr);
                    }
                };
                grid.appendChild(cell);
            }
        }

        function openDayDetail(dateStr, day) {
            dayDetailDate = dateStr;
            dayDetailTitle.textContent = `${day} ${MONTHS[currentMonth].toLowerCase()} ${currentYear}`;
            dayDetailList.innerHTML = '';
            const dayLessons = lessons.filter(l => l.date === dateStr).sort((a,b) => (a.time || '').localeCompare(b.time || ''));
            if (dayLessons.length === 0) {
                dayDetailList.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">Пока нет уроков</p>';
            } else {
                dayLessons.forEach(lesson => {
                    const card = document.createElement('div');
                    card.className = 'day-detail-card';
                    card.style.borderLeftColor = lesson.color;
                    card.style.background = lesson.color + '15';
                    const emojiPart = lesson.emoji ? `<span>${lesson.emoji}</span>` : '';
                    const planPreview = lesson.plan ? `<div class="dd-plan">📋 ${lesson.plan.substring(0, 60)}${lesson.plan.length > 60 ? '...' : ''}</div>` : '';
                    card.innerHTML = `
                        <div class="dd-name" style="color: ${lesson.color}">${emojiPart} ${lesson.name}</div>
                        <div class="dd-time">🕐 ${lesson.time || '--:--'}</div>
                        ${planPreview}
                    `;
                    card.onclick = () => {
                        closeModals();
                        openModal(lesson, dateStr);
                    };
                    dayDetailList.appendChild(card);
                });
            }
            dayDetailCard.classList.add('active');
            overlay.classList.add('active');
        }

        addFromDayBtn.onclick = () => {
            closeModals();
            openModal(null, dayDetailDate);
        };

        function openModal(lesson = null, dateStr = null) {
            selectedDate = dateStr;
            if (lesson) {
                editingId = lesson.id;
                currentSeriesId = lesson.seriesId;
                document.getElementById('modalTitle').textContent = 'Редактирование урока';
                document.getElementById('studentName').value = lesson.name;
                document.getElementById('lessonPlan').value = lesson.plan || '';
                document.getElementById('homeworkGiven').value = lesson.homeworkGiven || '';
                document.getElementById('homeworkLink').value = lesson.homeworkLink || '';
                document.getElementById('homeworkNext').value = lesson.homeworkNext || '';
                document.getElementById('lessonLink').value = lesson.link || '';
                lessonEmojiInput.value = lesson.emoji || '';
                selectedColor = lesson.color || '#4CAF50';
                
                scheduleSlotsContainer.innerHTML = '';
                const dayOfWeek = new Date(dateStr + 'T00:00:00').getDay();
                const slot = createSlotElement(dayOfWeek, lesson.time, false);
                scheduleSlotsContainer.appendChild(slot);
                slot.querySelectorAll('.weekday-checkbox').forEach(cb => { cb.disabled = true; cb.parentElement.style.pointerEvents = 'none'; });
                addSlotBtn.style.display = 'none';
                extendGroup.classList.add('hidden');
                seriesNote.classList.add('hidden');
                deleteOneBtn.classList.remove('hidden');
                if (lesson.seriesId) deleteSeriesBtn.classList.remove('hidden');
                else deleteSeriesBtn.classList.add('hidden');
            } else {
                editingId = null;
                currentSeriesId = null;
                document.getElementById('modalTitle').textContent = 'Новый ученик';
                document.getElementById('studentName').value = '';
                document.getElementById('lessonPlan').value = '';
                document.getElementById('homeworkGiven').value = '';
                document.getElementById('homeworkLink').value = '';
                document.getElementById('homeworkNext').value = '';
                document.getElementById('lessonLink').value = '';
                lessonEmojiInput.value = '';
                selectedColor = '#4CAF50';
                
                scheduleSlotsContainer.innerHTML = '';
                let initialDay = null;
                if (dateStr) initialDay = new Date(dateStr + 'T00:00:00').getDay();
                scheduleSlotsContainer.appendChild(createSlotElement(initialDay, '', false));
                addSlotBtn.style.display = 'block';
                seriesNote.classList.remove('hidden');
                extendGroup.classList.remove('hidden');
                extendMonthsCheckbox.checked = false;
                deleteOneBtn.classList.add('hidden');
                deleteSeriesBtn.classList.add('hidden');
            }

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector('.tab-btn[data-tab="plan"]').classList.add('active');
            document.getElementById('tab-plan').classList.add('active');

            renderColorPicker();
            modal.classList.add('active');
            overlay.classList.add('active');
        }

        function closeModals() {
            modal.classList.remove('active');
            settingsCard.classList.remove('active');
            dayDetailCard.classList.remove('active');
            overlay.classList.remove('active');
        }

        function renderColorPicker() {
            const container = document.getElementById('colorPicker');
            container.innerHTML = '';
            COLORS.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                if (color === selectedColor) swatch.classList.add('selected');
                swatch.style.backgroundColor = color;
                swatch.onclick = () => {
                    selectedColor = color;
                    renderColorPicker();
                };
                container.appendChild(swatch);
            });
        }

        saveBtn.onclick = () => {
            const name = document.getElementById('studentName').value.trim();
            if (!name) { alert('Введите имя ученика'); return; }

            const formData = {
                name: name,
                plan: document.getElementById('lessonPlan').value,
                homeworkGiven: document.getElementById('homeworkGiven').value,
                homeworkLink: document.getElementById('homeworkLink').value,
                homeworkNext: document.getElementById('homeworkNext').value,
                link: document.getElementById('lessonLink').value,
                color: selectedColor,
                emoji: lessonEmojiInput.value.trim()
            };

            if (editingId) {
                const slot = scheduleSlotsContainer.querySelector('.schedule-slot');
                const { time } = slot.getData();
                const index = lessons.findIndex(l => l.id === editingId);
                if (index !== -1) {
                    lessons[index] = { ...lessons[index], ...formData, time: time || lessons[index].time };
                }
            } else {
                const slots = Array.from(scheduleSlotsContainer.querySelectorAll('.schedule-slot'));
                const extendCount = extendMonthsCheckbox.checked ? parseInt(extendMonthsCount.value) : 0;
                let createdAny = false;
                
                slots.forEach(slot => {
                    const { days, time } = slot.getData();
                    if (days.length === 0 || !time) return;
                    createdAny = true;
                    
                    const seriesId = 'series_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);
                    
                    for (let monthOffset = 0; monthOffset <= extendCount; monthOffset++) {
                        const targetDate = new Date(currentYear, currentMonth + monthOffset, 1);
                        const tYear = targetDate.getFullYear();
                        const tMonth = targetDate.getMonth();
                        const daysInTargetMonth = new Date(tYear, tMonth + 1, 0).getDate();
                        
                        for (let d = 1; d <= daysInTargetMonth; d++) {
                            const loopDate = new Date(tYear, tMonth, d);
                            const dayOfWeek = loopDate.getDay();
                            
                            if (days.includes(dayOfWeek)) {
                                const dateStr = `${tYear}-${String(tMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                                const exists = lessons.some(l => l.date === dateStr && l.name === name && l.time === time);
                                
                                if (!exists) {
                                    const isInitialDay = (dateStr === selectedDate);
                                    const cardData = isInitialDay ? formData : {
                                        name: formData.name,
                                        color: formData.color,
                                        link: formData.link,
                                        emoji: formData.emoji,
                                        plan: '',
                                        homeworkGiven: '',
                                        homeworkLink: '',
                                        homeworkNext: ''
                                    };
                                    
                                    lessons.push({
                                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                                        seriesId: seriesId,
                                        date: dateStr,
                                        time: time,
                                        ...cardData
                                    });
                                }
                            }
                        }
                    }
                });
                
                if (!createdAny) {
                    alert('Выберите дни недели и время для хотя бы одного слота');
                    return;
                }
            }

            saveToStorage();
            renderCalendar();
            closeModals();
        };

        deleteOneBtn.onclick = () => {
            if (confirm('Удалить только этот урок?')) {
                lessons = lessons.filter(l => l.id !== editingId);
                saveToStorage();
                renderCalendar();
                closeModals();
            }
        };

        deleteSeriesBtn.onclick = () => {
            if (!currentSeriesId) return;
            if (confirm('Удалить ВСЕ уроки этой серии?')) {
                lessons = lessons.filter(l => l.seriesId !== currentSeriesId);
                saveToStorage();
                renderCalendar();
                closeModals();
            }
        };

        clearEmojiBtn.onclick = () => { lessonEmojiInput.value = ''; };
        addSlotBtn.onclick = () => {
            scheduleSlotsContainer.appendChild(createSlotElement(null, '', true));
        };

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
            };
        });

        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.onclick = () => {
                currentSize = btn.dataset.size;
                localStorage.setItem('tutorSize', currentSize);
                applySize();
            };
        });

        hideIndicatorCheckbox.checked = hideIndicator;
        hideIndicatorCheckbox.onchange = () => {
            hideIndicator = hideIndicatorCheckbox.checked;
            localStorage.setItem('tutorHideIndicator', hideIndicator);
            applyIndicator();
        };

        prevMonthBtn.onclick = () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11; currentYear--;
                if (currentYear < MIN_YEAR) { currentYear = MIN_YEAR; currentMonth = 0; }
            }
            monthSelect.value = `${currentYear}-${currentMonth}`;
            renderCalendar();
        };

        nextMonthBtn.onclick = () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0; currentYear++;
                if (currentYear > MAX_YEAR) { currentYear = MAX_YEAR; currentMonth = 11; }
            }
            monthSelect.value = `${currentYear}-${currentMonth}`;
            renderCalendar();
        };

        monthSelect.onchange = (e) => {
            const [y, m] = e.target.value.split('-').map(Number);
            currentYear = y; currentMonth = m;
            renderCalendar();
        };

        themeToggle.onclick = () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('tutorTheme', currentTheme);
            applyTheme();
        };

        settingsBtn.onclick = () => {
            renderPatternGrid();
            applySize();
            settingsCard.classList.add('active');
            overlay.classList.add('active');
        };

        bgUpload.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                currentBg = event.target.result;
                localStorage.setItem('tutorBg', currentBg);
                applyBackground();
            };
            reader.readAsDataURL(file);
        };

        clearBg.onclick = () => {
            currentBg = 'none';
            localStorage.setItem('tutorBg', currentBg);
            applyBackground();
            renderPatternGrid();
        };

        addFab.onclick = () => {
            const todayStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            openModal(null, todayStr);
        };

        closeModalBtn.onclick = closeModals;
        closeSettings.onclick = closeModals;
        closeDayDetail.onclick = closeModals;
        overlay.onclick = closeModals;

        // === ЗАПУСК ===
        populateMonthSelect();
        applyTheme();
        applySize();
        applyIndicator();
        applyBackground();
        renderEmojiPicker();
        renderCalendar();
    </script>

    <script>
    // === Регистрация Service Worker для PWA ===
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
                .then((registration) => {
                    console.log('✅ Service Worker зарегистрирован:', registration.scope);
                    
                    // Проверяем обновления
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                // Есть новая версия — предлагаем обновиться
                                if (confirm('Доступна новая версия приложения. Обновить сейчас?')) {
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                    window.location.reload();
                                }
                            }
                        });
                    });
                })
                .catch((error) => {
                    console.log('❌ Ошибка регистрации SW:', error);
                });
        });

        // Перезагружаем страницу при смене Service Worker
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
                refreshing = true;
                window.location.reload();
            }
        });
    }

    // === Установка PWA (кнопка "Установить") ===
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Показываем кнопку установки, если хочешь — добавь её в настройки
        console.log('💡 Приложение можно установить');
    });

    window.addEventListener('appinstalled', () => {
        console.log('🎉 Приложение установлено!');
        deferredPrompt = null;
    });
</script>
</body>
